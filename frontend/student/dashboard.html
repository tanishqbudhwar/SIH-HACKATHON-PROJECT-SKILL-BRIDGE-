<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard - SkillBridge</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="student-dashboard">

        <!-- Sidebar -->
        <aside class="dashboard-sidebar">

            <h2>SkillBridge</h2>

            <nav>
                <button
                    type="button"
                    class="active"
                    onclick="window.location.href='dashboard.html'">
                    Dashboard
                </button>
                <button>Assessment</button>
                <button>Opportunities</button>
                <button>Learning</button>
                <button>Portfolio</button>
                <button
                    type="button"
                    onclick="window.location.href='profile.html'">
                    Profile
                </button>
                <button>Settings</button>
            </nav>

        </aside>


        <!-- Main Area -->
        <main class="dashboard-main">

            <!-- Top Bar -->
            <header class="dashboard-topbar">

                <div></div>

                <div class="topbar-right">
                    <span>🔔</span>
                    <span>👤 <span id="topUserName">Student</span></span>
                </div>

            </header>


            <!-- Dashboard Content -->
            <section class="dashboard-content">

                <h1 id="welcomeMessage">Good morning 👋</h1>

                <p class="dashboard-subtitle">
                    Complete your profile to improve matching.
                </p>


                <!-- Stats -->
                <div class="dashboard-stats">

                    <div class="stat-card">
                        <h3>Skills</h3>
                        <strong>72%</strong>
                    </div>

                    <div class="stat-card">
                        <h3>Applied</h3>
                        <strong>3</strong>
                    </div>

                    <div class="stat-card">
                        <h3>Courses</h3>
                        <strong>2</strong>
                    </div>

                </div>


                <!-- Assessment -->
                <h2>Skill Assessment</h2>

                <div class="assessment-card">

                    <div>
                        <h3>Take your assessment</h3>

                        <p>
                            Find your strengths & skill gaps
                        </p>
                    </div>

                    <button
                         type="button"
                         onclick="window.location.href='assessment.html'">
                         Start →
                    </button>

                </div>


                <!-- Opportunities -->
                <h2>Recommended Opportunities</h2>

                <div class="opportunity-container">

                    <div class="opportunity-card">

                        <h3>Python Intern</h3>

                        <strong>82% Match</strong>

                        <br><br>

                        <button>View</button>

                    </div>


                    <div class="opportunity-card">

                        <h3>Data Analyst</h3>

                        <strong>76% Match</strong>

                        <br><br>

                        <button>View</button>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <script src="../js/dashboard.js"></script>

</body>

</html>
