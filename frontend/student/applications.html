<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications - SkillBridge</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .page-header {
            margin-bottom: 32px;
        }
        
        .page-header h1 {
            font-size: 28px;
            color: #1e293b;
            margin-bottom: 8px;
        }
        
        .page-header p {
            color: #64748b;
            font-size: 16px;
        }

        .applications-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .app-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        
        .app-card:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border-color: #cbd5e1;
        }

        .app-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .company-logo {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #94a3b8;
            border: 1px solid #f1f5f9;
        }

        .app-details h3 {
            font-size: 18px;
            color: #1e293b;
            margin: 0 0 4px 0;
        }
        
        .app-details p {
            font-size: 14px;
            color: #64748b;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .status-badge .material-icons-round {
            font-size: 16px;
        }

        .status-applied { background: #e0f2fe; color: #0369a1; }
        .status-review { background: #fef9c3; color: #854d0e; }
        .status-shortlisted { background: #f3e8ff; color: #6b21a8; }
        .status-interview { background: #ffedd5; color: #c2410c; }
        .status-selected { background: #dcfce7; color: #166534; }
        .status-rejected { background: #fee2e2; color: #b91c1c; }

        .app-meta {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }
        
        .app-date {
            font-size: 13px;
            color: #94a3b8;
        }

        .empty-state {
            text-align: center;
            padding: 64px 0;
            background: white;
            border-radius: 16px;
            border: 1px dashed #cbd5e1;
            color: #64748b;
        }
        
        .empty-state .material-icons-round {
            font-size: 48px;
            color: #cbd5e1;
            margin-bottom: 16px;
        }
        
        .empty-state a {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 24px;
            background: #c44d7a;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="student-dashboard">
        <!-- Overlay for mobile sidebar -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>
        <!-- Sidebar -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-header">
                <span class="material-icons-round logo-icon">spa</span>
                <h2>SkillBridge</h2>
            </div>
            
            <nav class="sidebar-nav">
                <button type="button" onclick="window.location.href='dashboard.html'">
                    <span class="material-icons-round">grid_view</span> Dashboard
                </button>
                <button type="button" onclick="window.location.href='assessment.html'">
                    <span class="material-icons-round">task_alt</span> Skill Assessment
                </button>
                <button type="button" onclick="window.location.href='skillmap.html'">
                    <span class="material-icons-round">account_tree</span> Skill Map
                </button>
                <button type="button" onclick="window.location.href='opportunities.html'">
                    <span class="material-icons-round">work</span> Opportunities
                </button>
                <button type="button" class="active" onclick="window.location.href='applications.html'">
                    <span class="material-icons-round">description</span> Applications
                </button>
                <button type="button" onclick="window.location.href='portfolio.html'">
                    <span class="material-icons-round">folder_special</span> Portfolio
                </button>
                <button type="button" onclick="window.location.href='profile.html'">
                    <span class="material-icons-round">person</span> Profile
                </button>
                <button type="button">
                    <span class="material-icons-round">settings</span> Settings
                </button>
                <button type="button" id="logoutBtn">
                    <span class="material-icons-round">logout</span> Log Out
                </button>
            </nav>
        </aside>

        <!-- Main Area -->
        <main class="dashboard-main">
            <!-- Top Bar -->
            <header class="dashboard-topbar">
                <div class="topbar-left">
                    <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Open navigation menu" aria-expanded="false">
                        <span class="material-icons-round">menu</span>
                    </button>
                </div>
                <div class="topbar-right">
                    <span class="material-icons-round notification-icon">notifications_none</span>
                    <div class="user-profile-menu">
                        <div class="user-info">
                            <span class="user-name" id="topUserName">Student Name</span>
                            <span class="user-role">Student</span>
                        </div>
                        <span class="material-icons-round dropdown-icon">expand_more</span>
                    </div>
                </div>
            </header>

            <!-- Dashboard Content -->
            <section class="dashboard-content">
                <div class="page-header">
                    <h1>My Applications</h1>
                    <p>Track the status of your internship and job applications.</p>
                </div>

                <div class="applications-list" id="applicationsContainer">
                    <div class="empty-state">
                        <span class="material-icons-round">hourglass_empty</span>
                        <h3>Loading applications...</h3>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/config.js"></script>
<script src="../js/dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const userData = localStorage.getItem('user');
            const token = localStorage.getItem('token');
            if(!userData || !token) {
                window.location.href = '../login.html';
                return;
            }

            try {
                const user = JSON.parse(userData);
                if(user.name) {
                    const nameSpan = document.getElementById('topUserName');
                    if(nameSpan) nameSpan.textContent = user.name;
                }

                const container = document.getElementById('applicationsContainer');
                
                // Fetch student's applications
                const response = await fetch(`${API_BASE_URL}/api/applications/my`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                
                if(response.ok) {
                    const applications = await response.json();
                    
                    if(applications.length === 0) {
                        container.innerHTML = `
                            <div class="empty-state">
                                <span class="material-icons-round">description</span>
                                <h3>No applications yet</h3>
                                <p>You haven't applied to any opportunities.</p>
                                <a href="opportunities.html">Browse Opportunities</a>
                            </div>
                        `;
                        return;
                    }

                    const getStatusConfig = (status) => {
                        switch(status) {
                            case "Applied": return { class: "status-applied", icon: "send" };
                            case "Under Review": return { class: "status-review", icon: "visibility" };
                            case "Shortlisted": return { class: "status-shortlisted", icon: "star" };
                            case "Interview": return { class: "status-interview", icon: "event" };
                            case "Selected": return { class: "status-selected", icon: "check_circle" };
                            case "Rejected": return { class: "status-rejected", icon: "cancel" };
                            default: return { class: "status-applied", icon: "info" };
                        }
                    };

                    container.innerHTML = applications.map(app => {
                        const statusConfig = getStatusConfig(app.status);
                        const oppTitle = app.opportunity ? app.opportunity.title : "Unknown Opportunity";
                        const oppType = app.opportunity ? app.opportunity.opportunityType : "";
                        const companyName = app.company ? app.company.name : "Unknown Company";
                        const date = new Date(app.createdAt).toLocaleDateString("en-US", { year: 'numeric', month: 'short', day: 'numeric' });

                        return `
                            <div class="app-card">
                                <div class="app-info">
                                    <div class="company-logo">
                                        <span class="material-icons-round">business</span>
                                    </div>
                                    <div class="app-details">
                                        <h3>${oppTitle}</h3>
                                        <p>
                                            <span style="font-weight: 500; color: #475569;">${companyName}</span>
                                            ${oppType ? `• ${oppType}` : ''}
                                        </p>
                                    </div>
                                </div>
                                <div class="app-meta">
                                    <span class="status-badge ${statusConfig.class}">
                                        <span class="material-icons-round">${statusConfig.icon}</span>
                                        ${app.status}
                                    </span>
                                    <span class="app-date">Applied on ${date}</span>
                                </div>
                            </div>
                        `;
                    }).join('');

                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <span class="material-icons-round">error</span>
                            <h3>Failed to load applications</h3>
                        </div>
                    `;
                }
            } catch(e) {
                console.error(e);
            }
        });
    </script>
</body>
</html>
