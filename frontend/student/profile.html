<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile - SkillBridge</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="student-dashboard">

        <!-- Sidebar -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-header">
                <span class="material-icons-round logo-icon">spa</span>
                <h2>SkillBridge</h2>
            </div>
            
            <nav class="sidebar-nav">
                <button type="button" onclick="window.location.href='dashboard.html'">
                    <span class="material-icons-round">grid_view</span> Dashboard
                </button>
                <button type="button" onclick="window.location.href='assessment.html'">
                    <span class="material-icons-round">task_alt</span> Skill Assessment
                </button>
                <button type="button">
                    <span class="material-icons-round">account_tree</span> Skill Map
                </button>
                <button type="button">
                    <span class="material-icons-round">work</span> Opportunities
                </button>
                <button type="button">
                    <span class="material-icons-round">description</span> Applications
                </button>
                <button type="button">
                    <span class="material-icons-round">folder_special</span> Portfolio
                </button>
                <button type="button" class="active" onclick="window.location.href='profile.html'">
                    <span class="material-icons-round">person</span> Profile
                </button>
                <button type="button">
                    <span class="material-icons-round">settings</span> Settings
                </button>
                <button type="button" id="logoutBtn">
                    <span class="material-icons-round">logout</span> Log Out
                </button>
            </nav>
        </aside>

        <!-- Main Area -->
        <main class="dashboard-main">
            <!-- Top Bar -->
            <header class="dashboard-topbar">
                <div class="topbar-left"></div>
                <div class="topbar-right">
                    <span class="material-icons-round notification-icon">notifications_none</span>
                    <div class="user-profile-menu">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="Profile Picture" class="profile-pic" id="topProfilePic">
                        <div class="user-info">
                            <span class="user-name" id="topUserName">Sachin</span>
                            <span class="user-role">Student</span>
                        </div>
                        <span class="material-icons-round dropdown-icon">expand_more</span>
                    </div>
                </div>
            </header>


            <section class="dashboard-content">

                <h1>My Profile</h1>

                <p class="dashboard-subtitle">
                    Complete your profile to improve your opportunity matching.
                </p>


                <div class="profile-card">

                    <div class="profile-field">
                        <label>College</label>
                        <input
                            type="text"
                            id="college"
                            placeholder="Enter your college">
                    </div>


                    <div class="profile-field">
                        <label>Course</label>
                        <input
                            type="text"
                            id="course"
                            placeholder="e.g. BTech CSE">
                    </div>


                    <div class="profile-field">
                        <label>Year</label>
                        <input
                            type="number"
                            id="year"
                            placeholder="e.g. 2">
                    </div>


                    <div class="profile-field">
                        <label>Skills</label>
                        <input
                            type="text"
                            id="skills"
                            placeholder="C++, Python, HTML, JavaScript">
                    </div>


                    <div class="profile-field">
                        <label>Bio</label>
                        <textarea
                            id="bio"
                            placeholder="Tell us about yourself"></textarea>
                    </div>


                    <button type="button" id="saveProfileButton">
                        Save Profile
                    </button>

                </div>

            </section>

        </main>

    </div>


    <script src="../js/profile.js"></script>

</body>

</html>
