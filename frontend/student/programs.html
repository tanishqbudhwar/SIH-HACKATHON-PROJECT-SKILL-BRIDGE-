<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Programs - SkillBridge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .programs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            flex-wrap: wrap;
        }

        .filter-input {
            padding: 10px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #f8f9fc;
        }

        .filter-input:focus {
            border-color: #c44d79;
        }

        .programs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .program-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .program-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
        }

        .program-card.recommended {
            border-color: #c44d79;
            box-shadow: 0 0 0 1px #c44d79;
        }

        .recommended-badge {
            background: #fdf2f6;
            color: #c44d79;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            align-self: flex-start;
            margin-bottom: -8px;
        }

        .program-title {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .program-company {
            font-size: 14px;
            color: #64748b;
        }

        .program-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 13px;
            color: #475569;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .meta-item .material-icons-round {
            font-size: 16px;
        }

        .program-skills {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .skill-tag {
            background: #f1f5f9;
            color: #475569;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
        }

        .program-footer {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .seats-info {
            font-size: 13px;
            color: #64748b;
            font-weight: 500;
        }

        .btn-enroll {
            background: #c44d79;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-enroll:hover {
            background: #a83d63;
        }

        .btn-enroll:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        .loading-state, .empty-state, .error-state {
            text-align: center;
            padding: 48px;
            color: #64748b;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <div class="student-dashboard">
        <!-- Overlay for mobile sidebar -->
        <div id="sidebarOverlay" class="sidebar-overlay"></div>
        <!-- Sidebar -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-header">
                <span class="material-icons-round logo-icon">spa</span>
                <h2>SkillBridge</h2>
            </div>
            
            <nav class="sidebar-nav">
                <button type="button" onclick="window.location.href='dashboard.html'">
                    <span class="material-icons-round">grid_view</span> Dashboard
                </button>
                <button type="button" onclick="window.location.href='assessment.html'">
                    <span class="material-icons-round">task_alt</span> Skill Assessment
                </button>
                <button type="button" class="active" onclick="window.location.href='programs.html'">
                    <span class="material-icons-round">book</span> Learning Programs
                </button>
                <button type="button" onclick="window.location.href='opportunities.html'">
                    <span class="material-icons-round">work</span> Opportunities
                </button>
                <button type="button" onclick="window.location.href='profile.html'">
                    <span class="material-icons-round">person</span> Profile
                </button>
                <button type="button" id="logoutBtn">
                    <span class="material-icons-round">logout</span> Log Out
                </button>
            </nav>
        </aside>

        <!-- Main Area -->
        <main class="dashboard-main">
            <!-- Top Bar -->
            <header class="dashboard-topbar">
                <div class="topbar-left">
                    <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Open navigation menu">
                        <span class="material-icons-round">menu</span>
                    </button>
                </div>
                <div class="topbar-right">
                    <span class="material-icons-round notification-icon">notifications_none</span>
                    <div class="user-profile-menu">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="Profile" class="profile-pic" id="topProfilePic">
                        <div class="user-info">
                            <span class="user-name" id="topUserName">Student</span>
                            <span class="user-role">Student</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Dashboard Content -->
            <section class="dashboard-content">
                <div class="programs-header">
                    <div>
                        <h1>Learning Programs</h1>
                        <p style="color: #64748b; margin-top: 8px;">Discover industry-led programs designed to bridge your skill gaps.</p>
                    </div>
                </div>

                <!-- Filters -->
                <div class="filter-bar">
                    <input type="text" id="searchProg" class="filter-input" placeholder="Search programs..." style="flex: 1; min-width: 200px;">
                    <select id="filterDifficulty" class="filter-input">
                        <option value="all">All Difficulties</option>
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>
                    <select id="filterMode" class="filter-input">
                        <option value="all">All Modes</option>
                        <option value="Online">Online</option>
                        <option value="Offline">Offline</option>
                        <option value="Hybrid">Hybrid</option>
                    </select>
                </div>

                <!-- Programs Grid -->
                <div class="programs-grid" id="studentProgramsContainer">
                    <div class="loading-state">Loading learning programs...</div>
                </div>
            </section>
        </main>
    </div>

    <!-- The actual logic -->
    <script src="../js/config.js"></script>
<script src="../js/studentPrograms.js"></script>
    <script>
        // Hamburger Menu Logic
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const sidebar = document.querySelector('.dashboard-sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const logoutBtn = document.getElementById('logoutBtn');

        if(mobileMenuBtn && sidebar && overlay) {
            mobileMenuBtn.addEventListener('click', () => {
                sidebar.classList.add('active');
                overlay.classList.add('active');
            });
            overlay.addEventListener('click', () => {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            });
        }

        if(logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                localStorage.removeItem("token");
                localStorage.removeItem("user");
                window.location.href = "../login.html";
            });
        }

        // Set User Name
        const userStr = localStorage.getItem("user");
        if(userStr) {
            const user = JSON.parse(userStr);
            const topUserName = document.getElementById("topUserName");
            if(topUserName && user.name) topUserName.textContent = user.name;
        }
    </script>
</body>
</html>
