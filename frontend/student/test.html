<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillBridge - Skill Assessment</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="../js/config.js"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        skillbridge: {
                            bgStart: '#751c3d',
                            bgEnd: '#4a0f24',
                            accent: '#eb6996',
                            accentHover: '#d85882',
                            accentLight: '#fdf2f6',
                        }
                    },
                    boxShadow: {
                        'premium': '0 20px 40px -5px rgba(0, 0, 0, 0.3), 0 10px 20px -5px rgba(0, 0, 0, 0.2)',
                        'glow': '0 0 20px rgba(235, 105, 150, 0.4)',
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom styles for smooth interactive transitions */
        body {
            background: linear-gradient(135deg, #751c3d 0%, #4a0f24 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .option-card {
            transition: all 0.2s ease-in-out;
        }

        .option-card:hover:not(.selected) {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .option-card.selected {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(235, 105, 150, 0.1), 0 2px 4px -1px rgba(235, 105, 150, 0.06);
            border-color: #eb6996 !important;
            background-color: #fdf2f6 !important;
            --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(4px + var(--tw-ring-offset-width)) rgba(235, 105, 150, 0.1);
            box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
        }
        
        .radio-custom {
            transition: all 0.2s ease;
        }

        .option-card.selected .radio-custom {
            border-color: #eb6996;
            background-color: #eb6996;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .option-card.selected .radio-custom::after {
            content: '';
            width: 10px;
            height: 10px;
            background-color: white;
            border-radius: 50%;
        }

        .option-card.selected .option-letter {
            background-color: #eb6996 !important;
            color: white !important;
        }
    </style>
</head>
<body class="font-sans text-gray-800 antialiased selection:bg-skillbridge-accent selection:text-white">

    <header class="w-full px-6 py-6 flex justify-between items-center relative z-10">
        <div class="flex items-center gap-2">
            <h1 class="font-serif text-white text-2xl md:text-3xl font-semibold tracking-wide">SkillBridge</h1>
        </div>
        <button id="exitBtn" class="flex items-center gap-2 text-white/80 hover:text-white border border-white/20 hover:border-white/40 bg-white/5 hover:bg-white/10 backdrop-blur-sm px-4 py-2 rounded-lg text-sm font-medium transition-all">
            <i class="ph ph-sign-out text-lg"></i>
            Exit Assessment
        </button>
    </header>

    <main class="flex-grow flex items-center justify-center p-4 md:p-6 lg:p-8 relative z-10 w-full max-w-5xl mx-auto">
        
        <!-- Main Assessment Card -->
        <div class="bg-white w-full rounded-3xl shadow-premium overflow-hidden flex flex-col relative" id="assessmentCard" style="display: none;">
            
            <!-- Top Color Accent Line -->
            <div class="h-1.5 w-full bg-skillbridge-accent"></div>

            <div class="p-6 md:p-10 lg:p-12 flex flex-col h-full">
                
                <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
                    <div class="flex items-center gap-3">
                        <div class="bg-skillbridge-accentLight text-skillbridge-accent font-semibold px-3 py-1 rounded-md text-sm tracking-wide">
                            MCQ
                        </div>
                        <h2 class="text-gray-500 font-medium">Question <span id="questionCounter">1</span> <span class="text-gray-400">/ 10</span></h2>
                    </div>
                    
                    <!-- Progress Bar -->
                    <div class="w-full md:w-64 flex items-center gap-3">
                        <div id="progressText" class="text-xs font-semibold text-gray-400 w-8">10%</div>
                        <div class="h-2.5 w-full bg-gray-100 rounded-full overflow-hidden flex-grow">
                            <div id="progressBar" class="h-full bg-skillbridge-accent rounded-full transition-all duration-500 ease-out" style="width: 10%;"></div>
                        </div>
                    </div>
                </div>

                <div class="mb-10">
                    <h3 id="questionText" class="text-2xl md:text-3xl font-semibold text-gray-800 leading-tight md:leading-snug">
                        Loading question...
                    </h3>
                </div>

                <div class="flex flex-col gap-4 mb-12 flex-grow" id="optionsContainer">
                    
                    <!-- Option A -->
                    <button id="optionA" data-option="A" class="option-card group flex items-center w-full text-left border-2 border-gray-100 rounded-2xl p-4 md:p-5 bg-white hover:border-skillbridge-accent hover:bg-skillbridge-accentLight">
                        <div class="option-letter flex-shrink-0 flex items-center justify-center w-10 h-10 rounded-xl bg-gray-100 text-gray-500 font-bold mr-4 group-hover:bg-white group-hover:text-skillbridge-accent transition-colors shadow-sm">
                            A
                        </div>
                        <div class="flex-grow">
                            <p id="optionAText" class="text-lg font-medium text-gray-700 group-hover:text-gray-900">Loading...</p>
                        </div>
                        <div class="flex-shrink-0 ml-4 radio-custom w-6 h-6 rounded-full border-2 border-gray-200 group-hover:border-skillbridge-accent"></div>
                    </button>

                    <!-- Option B -->
                    <button id="optionB" data-option="B" class="option-card group flex items-center w-full text-left border-2 border-gray-100 rounded-2xl p-4 md:p-5 bg-white hover:border-skillbridge-accent hover:bg-skillbridge-accentLight">
                        <div class="option-letter flex-shrink-0 flex items-center justify-center w-10 h-10 rounded-xl bg-gray-100 text-gray-500 font-bold mr-4 group-hover:bg-white group-hover:text-skillbridge-accent transition-colors shadow-sm">
                            B
                        </div>
                        <div class="flex-grow">
                            <p id="optionBText" class="text-lg font-medium text-gray-700 group-hover:text-gray-900">Loading...</p>
                        </div>
                        <div class="flex-shrink-0 ml-4 radio-custom w-6 h-6 rounded-full border-2 border-gray-200 group-hover:border-skillbridge-accent"></div>
                    </button>

                    <!-- Option C -->
                    <button id="optionC" data-option="C" class="option-card group flex items-center w-full text-left border-2 border-gray-100 rounded-2xl p-4 md:p-5 bg-white hover:border-skillbridge-accent hover:bg-skillbridge-accentLight">
                        <div class="option-letter flex-shrink-0 flex items-center justify-center w-10 h-10 rounded-xl bg-gray-100 text-gray-500 font-bold mr-4 shadow-md group-hover:bg-white group-hover:text-skillbridge-accent transition-colors">
                            C
                        </div>
                        <div class="flex-grow">
                            <p id="optionCText" class="text-lg font-medium text-gray-700 group-hover:text-gray-900">Loading...</p>
                        </div>
                        <div class="flex-shrink-0 ml-4 radio-custom w-6 h-6 rounded-full border-2 border-gray-200 group-hover:border-skillbridge-accent flex items-center justify-center">
                        </div>
                    </button>

                    <!-- Option D -->
                    <button id="optionD" data-option="D" class="option-card group flex items-center w-full text-left border-2 border-gray-100 rounded-2xl p-4 md:p-5 bg-white hover:border-skillbridge-accent hover:bg-skillbridge-accentLight">
                        <div class="option-letter flex-shrink-0 flex items-center justify-center w-10 h-10 rounded-xl bg-gray-100 text-gray-500 font-bold mr-4 group-hover:bg-white group-hover:text-skillbridge-accent transition-colors shadow-sm">
                            D
                        </div>
                        <div class="flex-grow">
                            <p id="optionDText" class="text-lg font-medium text-gray-700 group-hover:text-gray-900">Loading...</p>
                        </div>
                        <div class="flex-shrink-0 ml-4 radio-custom w-6 h-6 rounded-full border-2 border-gray-200 group-hover:border-skillbridge-accent"></div>
                    </button>

                </div>

                <div class="pt-6 border-t border-gray-100 flex items-center justify-between mt-auto">
                    <!-- Back Button -->
                    <button id="backBtn" class="flex items-center gap-2 px-5 py-3 rounded-xl text-gray-500 font-medium hover:bg-gray-100 hover:text-gray-800 transition-all focus:outline-none focus:ring-2 focus:ring-gray-200 opacity-50 cursor-not-allowed" disabled>
                        <i class="ph ph-arrow-left text-lg"></i>
                        <span>Back</span>
                    </button>

                    <!-- Next Button -->
                    <button id="nextBtn" class="flex items-center gap-2 px-8 py-3.5 rounded-xl bg-skillbridge-accent text-white font-semibold shadow-glow hover:bg-skillbridge-accentHover transition-all focus:outline-none focus:ring-4 focus:ring-skillbridge-accent/30 transform hover:-translate-y-0.5">
                        <span id="nextBtnText">Next Question</span>
                        <i class="ph ph-arrow-right text-lg"></i>
                    </button>
                </div>

            </div>
        </div>

        <!-- Loading Card (Displayed while AI generates questions) -->
        <div class="bg-white w-full rounded-3xl shadow-premium overflow-hidden flex flex-col relative" id="loadingCard">
            <div class="h-1.5 w-full bg-skillbridge-accent"></div>
            <div class="p-12 flex flex-col items-center justify-center h-96 text-center">
                <i class="ph ph-spinner-gap text-5xl text-skillbridge-accent animate-spin mb-6"></i>
                <h3 class="text-2xl font-semibold text-gray-800 mb-2">Generating Assessment...</h3>
                <p class="text-gray-500">Our AI is crafting a custom test for your skill.</p>
            </div>
        </div>

    </main>

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-[20%] -right-[10%] w-[50vw] h-[50vw] rounded-full bg-white opacity-5 blur-[120px]"></div>
        <div class="absolute -bottom-[20%] -left-[10%] w-[60vw] h-[60vw] rounded-full bg-[#eb6996] opacity-10 blur-[150px]"></div>
    </div>

    <!-- Link to the JS logic -->
    <script src="../js/test.js"></script>

</body>
</html>
