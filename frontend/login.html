<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Pacifico&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body class="gradient-background">
    <div class="top-bar-login">
        <h2>SkillBridge</h2>
        <button>←back</button>
    </div>
    <div id="login-box">

        <div class="welcome-message">
            <h2>Welcome Back 👋</h2>
            <h3>Login to continue to SkillBridge</h3>
        </div>
        <h3 class="login-as-title">Login as:</h3>
        <div class="login-as">

            <button type="button" class="login-role-button" data-role="student">
                Student
            </button>

            <button type="button" class="login-role-button" data-role="industry">
                Industry
            </button>

            <button type="button" class="login-role-button" data-role="college">
                College
            </button>

        </div>
        <div class="data-login">
            <div class="email-login">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>
            <div class="password-login">
                <label for="password">Password</label>

                <div class="password-box">
                    <input type="password" id="password" placeholder="Enter your password">

                    <button type="button" id="togglePassword">👁</button>
                </div>
            </div>
            <button type="button" id="loginButton">Login</button>
        </div>
        <div class="new-login">
            <p>Don't have an account? <a href="signup.html">Sign up</a></p>
        </div>
    </div>
    <script src="js/config.js"></script>
<script src="js/auth.js"></script>
</body>

</html>>
